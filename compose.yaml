name: projecthub
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: projecthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: projecthub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projecthub -d projecthub"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://projecthub:${POSTGRES_PASSWORD}@db:5432/projecthub?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://projecthub:${POSTGRES_PASSWORD}@db:5432/projecthub?schema=public
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/apps/api/uploads
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "/app/docker/check-health.cjs", "api"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    init: true
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/app/docker/check-health.cjs", "web"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  postgres_data:
  uploads:
